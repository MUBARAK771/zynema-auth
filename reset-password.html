<!doctype html>
<html lang="en">
  <head>
    <title>New password – Zynema</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/png" href="zynema-logo.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="auth">
      <aside class="art">
        <a class="brand" href="index.html">Zyn<i>e</i>ma</a>
        <h2>Your digital cinema.</h2>
        <p>
          Discover films, build your watchlist and pick up where you left off on
          any screen.
        </p>
      </aside>
      <main class="pane">
        <form class="form hidden" id="f" novalidate>
          <h1>Choose a new password</h1>
          <p class="sub">
            Use at least 8 characters with upper and lower case letters and a
            number.
          </p>
          <div class="field">
            <label for="pw">New password</label>
            <div class="inp">
              <input
                id="pw"
                type="password"
                autocomplete="new-password"
              /><button
                type="button"
                class="eye"
                data-eye="pw"
                aria-label="Show password"
              >
                Show
              </button>
            </div>
            <div class="err" id="pw-err"></div>
          </div>
          <div class="field">
            <label for="pw2">Confirm new password</label>
            <div class="inp">
              <input
                id="pw2"
                type="password"
                autocomplete="new-password"
              /><button
                type="button"
                class="eye"
                data-eye="pw2"
                aria-label="Show password"
              >
                Show
              </button>
            </div>
            <div class="err" id="pw2-err"></div>
          </div>
          <button class="btn btn-primary" id="go" type="submit">
            Update password
          </button>
        </form>
        <div class="form state hidden" id="bad">
          <div class="ico">⚠️</div>
          <h1>Link expired</h1>
          <p class="sub">This reset link is invalid or has expired.</p>
          <a class="btn btn-primary" href="forgot-password.html"
            >Request a new link</a
          >
        </div>
      </main>
    </div>
    <script type="module">
      import { getUser, updatePassword, logout } from "./js/auth.js";
      import { passwordScore, friendlyError } from "./js/validation.js";
      import {
        toast,
        setLoading,
        fieldError,
        wireEyeToggles,
      } from "./js/ui.js";
      import { supabase } from "./js/supabase.js";
      wireEyeToggles();
      const $ = (id) => document.getElementById(id);
      let busy = false;
      (await getUser())
        ? $("f").classList.remove("hidden")
        : $("bad").classList.remove("hidden");
      $("f").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (busy) return;
        const a = $("pw"),
          b = $("pw2");
        fieldError(
          a,
          passwordScore(a.value).ok
            ? ""
            : "Use 8+ characters with upper, lower case and a number.",
        );
        fieldError(b, a.value === b.value ? "" : "Passwords do not match.");
        if (!passwordScore(a.value).ok || a.value !== b.value) return;
        busy = true;
        setLoading($("go"), true, "Updating");
        try {
          await updatePassword(a.value);
          toast("Password updated. Sign in with your new password.", "success");
          await supabase.auth.signOut();
          setTimeout(() => location.replace("login.html"), 1500);
        } catch (err) {
          toast(friendlyError(err), "error");
          busy = false;
          setLoading($("go"), false);
        }
      });
    </script>
  </body>
</html>
