<!doctype html>
<html lang="en">
  <head>
    <title>Sign in – Zynema</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/png" href="zynema-logo.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="auth">
      <aside class="art">
        <a class="brand" href="index.html">Zyn<i>e</i>ma</a>
        <h2>Your digital cinema.</h2>
        <p>
          Discover films, build your watchlist and pick up where you left off on
          any screen.
        </p>
      </aside>

      <main class="pane">
        <form class="form" id="f" novalidate>
          <h1>Welcome back</h1>
          <p class="sub">Sign in to continue to Zynema.</p>

          <div class="field">
            <label for="email">Email address</label>
            <div class="inp">
              <input id="email" type="email" autocomplete="email" required />
            </div>
            <div class="err" id="email-err"></div>
          </div>

          <div class="field">
            <label for="pw">Password</label>
            <div class="inp">
              <input
                id="pw"
                type="password"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="eye"
                data-eye="pw"
                aria-label="Show password"
              >
                Show
              </button>
            </div>
            <div class="err" id="pw-err"></div>
          </div>

          <div class="row">
            <label class="chk">
              <input type="checkbox" id="rem" />
              <span>Remember my email</span>
            </label>
            <a href="forgot-password.html">Forgot password?</a>
          </div>

          <button class="btn btn-primary" id="go" type="submit">Sign in</button>

          <p class="alt">
            New to Zynema? <a href="signup.html">Create an account</a>
          </p>
        </form>
      </main>
    </div>

    <script type="module">
  import { supabase } from "./js/supabase.js";
  import { signIn, getUser, nextParam } from "./js/auth.js";
  import { isEmail, friendlyError } from "./js/validation.js";
  import {
    toast,
    setLoading,
    fieldError,
    wireEyeToggles,
    loadMovieArtwork,
  } from "./js/ui.js";

  wireEyeToggles();
  loadMovieArtwork();

  const $ = (id) => document.getElementById(id);
const DASHBOARD_ORIGIN = "https://app.zynema-app.online";
const HANDOFF_ENDPOINT = `${DASHBOARD_ORIGIN}/api/auth/handoff`;
  const logoutRequested =
    new URLSearchParams(window.location.search).get("logout") === "1";
  let busy = false;

  const saved = localStorage.getItem("zy_remember");
  if (saved) {
    $("email").value = saved;
    $("rem").checked = true;
  }
  function safeDashboardPath(value) {
    try {
      const destination = new URL(value || "/", DASHBOARD_ORIGIN);
      if (destination.origin !== DASHBOARD_ORIGIN) return "/";
      return `${destination.pathname}${destination.search}${destination.hash}`;
    } catch {
      return "/";
    }
  }

  function handoffToDashboard(session, requestedNext) {
    if (
      !session?.access_token ||
      !session?.refresh_token ||
      !session?.user?.id
    ) {
      throw new Error("Your login session could not be verified. Please sign in again.");
    }

    const expiresAt = Number(
      session.expires_at ??
        Math.floor(Date.now() / 1000) + Number(session.expires_in || 3600)
    );

    if (!Number.isFinite(expiresAt) || expiresAt <= Math.floor(Date.now() / 1000)) {
      throw new Error("Your login session has expired. Please sign in again.");
    }

    const values = {
      access_token: session.access_token,
      refresh_token: session.refresh_token,
      expires_at: String(expiresAt),
      user_id: session.user.id,
      next: safeDashboardPath(requestedNext),
    };

    const form = document.createElement("form");
    form.method = "POST";
    form.action = HANDOFF_ENDPOINT;
    form.enctype = "application/x-www-form-urlencoded";
    form.hidden = true;

    for (const [name, value] of Object.entries(values)) {
      const input = document.createElement("input");
      input.type = "hidden";
      input.name = name;
      input.value = value;
      form.appendChild(input);
    }

    document.body.appendChild(form);
    form.submit();
  }

  if (logoutRequested) {
    try {
      const { error } = await supabase.auth.signOut();
      if (error) throw error;
      toast("You have been signed out.", "success");
    } catch (error) {
      toast(friendlyError(error), "error");
    }

    window.history.replaceState(
      null,
      "",
      `${window.location.pathname}${window.location.hash}`
    );
  } else {
    try {
      const existingUser = await getUser();
      if (existingUser?.email_confirmed_at) {
        const { data, error } = await supabase.auth.getSession();
        if (error) throw error;
        if (data.session) {
          handoffToDashboard(data.session, nextParam());
        }
      }
    } catch (error) {
      console.error("Existing-session handoff failed:", error);
      toast(friendlyError(error), "error");
    }
  }

  $("f").addEventListener("submit", async (event) => {
    event.preventDefault();
    if (busy) return;

    const emailInput = $("email");
    const passwordInput = $("pw");

    fieldError(
      emailInput,
      isEmail(emailInput.value) ? "" : "Enter a valid email address."
    );
    fieldError(
      passwordInput,
      passwordInput.value ? "" : "Enter your password."
    );

    if (!isEmail(emailInput.value) || !passwordInput.value) return;

    busy = true;
    setLoading($("go"), true, "Signing in");

    try {
      const data = await signIn({
        email: emailInput.value.trim(),
        password: passwordInput.value,
      });

      if (!data.session) {
        throw new Error("Sign-in succeeded but no session was returned. Please try again.");
      }

      if ($("rem").checked) {
        localStorage.setItem("zy_remember", emailInput.value.trim());
      } else {
        localStorage.removeItem("zy_remember");
      }

      handoffToDashboard(data.session, nextParam());
    } catch (error) {
      if (/confirm/i.test(error?.message ?? "")) {
        sessionStorage.setItem("zy_email", emailInput.value.trim());
        toast(friendlyError(error), "error");
        setTimeout(() => {
          window.location.href = "verify-email.html";
        }, 1800);
      } else {
        toast(friendlyError(error), "error");
      }

      busy = false;
      setLoading($("go"), false);
    }
  });
</script>
  </body>
</html>
