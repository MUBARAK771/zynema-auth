<!doctype html>
<html lang="en">
  <head>
    <title>Verifying… – Zynema</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/png" href="zynema-logo.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="auth">
      <aside class="art">
        <a class="brand" href="index.html">Zyn<i>e</i>ma</a>
        <h2>Your digital cinema.</h2>
        <p>
          Discover films, build your watchlist and pick up where you left off on
          any screen.
        </p>
      </aside>
      <main class="pane">
        <div class="form state" id="s">
          <div
            class="spin"
            style="margin: 0 auto 1rem; width: 32px; height: 32px"
          ></div>
          <h1>One moment…</h1>
        </div>
        <div class="form state hidden" id="bad">
          <div class="ico">⚠️</div>
          <h1>Link problem</h1>
          <p class="sub" id="why">This link is invalid or has expired.</p>
          <a class="btn btn-primary" href="login.html">Back to sign in</a>
        </div>
      </main>
    </div>
    <script type="module">
      import { supabase } from "./js/supabase.js";
      import { CONFIG } from "./js/config.js";
      const q = new URLSearchParams(location.search),
        h = new URLSearchParams(location.hash.slice(1));
      const type = q.get("type") || h.get("type"),
        code = q.get("code"),
        tokenHash = q.get("token_hash") || h.get("token_hash"),
        err =
          q.get("error_description") ||
          h.get("error_description") ||
          q.get("error_code") ||
          h.get("error_code") ||
          q.get("error") ||
          h.get("error");
      function fail(m) {
        document.getElementById("s").classList.add("hidden");
        document.getElementById("bad").classList.remove("hidden");
        if (m) document.getElementById("why").textContent = m;
      }
      history.replaceState(
        null,
        "",
        location.pathname + (type ? "?type=" + encodeURIComponent(type) : ""),
      ); // keep codes/tokens out of visible URL
      if (err)
        fail(
          /expired/i.test(err)
            ? "This link has expired. Request a new one."
            : "This link is invalid.",
        );
      else if (!code && !tokenHash)
        fail(
          "This confirmation link is incomplete. Request a new email and open its full confirmation link. If this keeps happening, contact support.",
        );
      else {
        try {
          const result = code
            ? await supabase.auth.exchangeCodeForSession(code)
            : await supabase.auth.verifyOtp({
                token_hash: tokenHash,
                type: type === "recovery" ? "recovery" : "email",
              });
          if (result.error) {
            fail(
              /expired/i.test(result.error.message)
                ? "This link has expired. Request a new one."
                : "This link is invalid or was already used.",
            );
          } else if (!result.data?.session || !result.data?.user) {
            fail("This link did not create a valid session. Request a new one.");
          } else if (type === "recovery") {
            location.replace("reset-password.html");
          } else if (
            (type === "signup" || type === "email") &&
            result.data.user.email_confirmed_at
          ) {
            try {
              const { error } = await supabase.auth.signOut();
              if (error) {
                fail(
                  "Your email was confirmed, but we couldn't clear the temporary session. Please return to sign in and try again.",
                );
              } else {
                location.replace(CONFIG.LOGIN_URL);
              }
            } catch {
              fail(
                "Your email was confirmed, but we couldn't clear the temporary session. Please return to sign in and try again.",
              );
            }
          } else {
            fail("Your email could not be verified. Request a new confirmation link.");
          }
        } catch {
          fail("We couldn't verify this link right now. Please try again.");
        }
      }
    </script>
  </body>
</html>
